name: Backend CI

on:
  push:
    branches: [ "main", "staging" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [ "main", "staging" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Backend Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./backend

    env:
      ENVIRONMENT: test
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-mock-groq-key' }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'ci-mock-tavily-key' }}
      DEFAULT_LLM_PROVIDER: groq

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatting and linting check
        run: |
          # Basic syntax verification across all Python files
          python -m compileall app tests

      - name: Run unit tests with pytest
        run: |
          pytest -v --durations=10
